name: Windows paths and settings

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paths-settings:
    name: Paths and settings (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Record native runtime
        run: python -c "import platform, sys; print(platform.platform()); print(sys.version)"
      - name: Install the shared engine and backend tests
        run: |
          python -m pip install -e engine
          python -m pip install -e "app[test]"
      # Narrow #6 contracts; the full portable runner belongs to #11.
      # Each entry point isolates user roots before importing the checkout.
      - name: Paths, profiles, UTF-8 and failed-write recovery
        run: python engine/tests/test_windows_paths.py
      - name: Existing credential key compatibility
        run: python engine/tests/test_settings_key.py
      - name: Backend fixture, source imports and direct settings consumers
        run: python -m pytest -q app/tests/test_path_fixture.py app/tests/test_settings_persistence.py
