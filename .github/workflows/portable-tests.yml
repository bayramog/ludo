name: Native Python tests

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Engine and backend (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Record native runtime
        run: python -c "import platform, sys; print(platform.platform()); print(sys.version)"
      - name: Install the shared engine and backend tests
        id: install
        run: |
          python -m pip install -e engine
          python -m pip install -e "app[test]"
      - name: Native backend launch, profile switch and shutdown
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node --test desktop/tests/backend-lifecycle.test.mjs desktop/tests/backend.native.mjs
      - name: Windows owned process tree and external emulator
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.install.outcome == 'success' }}
        run: python desktop/tests/windows_process_tree.py
      - name: Runner negative contracts
        run: python -m unittest discover -s scripts/tests -v
      - name: Native engine scripts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python engine/tests/run.py --native --report-dir test-evidence/engine
      - name: Native backend tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python scripts/test_backend.py --native --report-dir test-evidence/backend
      # Only bounded structural summaries: never profile files or raw logs/XML.
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-failure-${{ matrix.os }}-${{ matrix.python }}
          path: test-evidence/*/summary.json
          retention-days: 7
          if-no-files-found: warn
